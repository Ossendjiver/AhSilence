name: Apply ANC v0.6.10 clean-tone control patch
on:
  push:
    branches: [ feature/room-anc-v062 ]
    paths:
      - 'tools/apply_v0610_clean_tone_control.py'
      - '.github/workflows/apply-v0610-clean-tone-control.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/room-anc-v062
          fetch-depth: 0
      - name: Apply clean-tone control patch
        run: python3 tools/apply_v0610_clean_tone_control.py
      - name: Commit v0.6.10 update
        run: |
          git config user.name 'Ossendjiver'
          git config user.email '39517879+Ossendjiver@users.noreply.github.com'
          git add anclab
          git diff --cached --check
          git commit -m 'Use clean narrowband path measurements before cancellation'
          git push origin HEAD:feature/room-anc-v062
