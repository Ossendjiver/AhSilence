name: Apply Room ANC v0.6.3 effectiveness and UI patch
on:
  push:
    branches: [ feature/room-anc-v062 ]
    paths:
      - 'tools/apply_room_v063_effectiveness_ui.py'
      - '.github/workflows/apply-room-v062-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/room-anc-v062
          fetch-depth: 0
      - name: Apply Room effectiveness verification and profile UI
        run: python3 tools/apply_room_v063_effectiveness_ui.py
      - name: Commit Room v0.6.3 update
        run: |
          git config user.name 'Ossendjiver'
          git config user.email '39517879+Ossendjiver@users.noreply.github.com'
          git add anclab .github/workflows/build-anclab.yml
          git diff --cached --check
          git commit -m 'Verify Room ANC effectiveness and reorganize profile settings'
          git push origin HEAD:feature/room-anc-v062
