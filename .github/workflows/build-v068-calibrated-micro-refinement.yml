name: Build ANC Lab v0.6.8 calibrated micro-refinement
on:
  push:
    branches: [ feature/room-anc-v062 ]
    paths:
      - 'anclab/**'
      - '.github/workflows/build-v068-calibrated-micro-refinement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/room-anc-v062
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and assemble
        run: |
          chmod +x gradlew
          ./gradlew :anclab:clean :anclab:testDebugUnitTest :anclab:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ANC-Lab-v0.6.8-calibrated-micro-refinement-dev-debug
          path: anclab/build/outputs/apk/debug/anclab-debug.apk
