name: Apply ANC v0.6.10 CI fix

on:
  push:
    branches: [ feature/room-anc-v062 ]
    paths:
      - '.github/workflows/apply-v0610-ci-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/room-anc-v062
      - name: Apply CI compatibility fix
        run: python tools/apply_v0610_ci_fix.py
      - name: Commit CI compatibility fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add anclab/src/main/java/com/p38/anclab/dsp/AutoController.java
          if ! git diff --cached --quiet; then
            git commit -m 'Fix v0.6.10 controller CI compatibility'
            git push origin HEAD:feature/room-anc-v062
          fi
