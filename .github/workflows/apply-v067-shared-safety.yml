name: Apply ANC v0.6.7 shared calibrated safety patch
on:
  push:
    branches: [ feature/room-anc-v062 ]
    paths:
      - 'tools/apply_v067_shared_calibrated_safety.py'
      - '.github/workflows/apply-v067-shared-safety.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/room-anc-v062
          fetch-depth: 0
      - name: Apply shared calibrated ANC safety patch
        run: python3 tools/apply_v067_shared_calibrated_safety.py
      - name: Commit v0.6.7 update
        run: |
          git config user.name 'Ossendjiver'
          git config user.email '39517879+Ossendjiver@users.noreply.github.com'
          git add anclab
          git diff --cached --check
          git commit -m 'Share calibrated no-blind-probe safety across profiles'
          git push origin HEAD:feature/room-anc-v062
