name: Build ANC Lab APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/headphone-fxnlms-v05
    paths:
      - 'anclab/**'
      - 'settings.gradle.kts'
      - '.github/workflows/build-anclab.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Restore ANC Lab debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: anclab-debug-signing-v1
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build ANC Lab debug APK
        run: ./gradlew :anclab:clean :anclab:assembleDebug --stacktrace
      - name: Upload ANC Lab APK
        uses: actions/upload-artifact@v4
        with:
          name: ANC-Lab-v0.5.0-rebuild-debug
          path: anclab/build/outputs/apk/debug/anclab-debug.apk
          if-no-files-found: error
          retention-days: 14
