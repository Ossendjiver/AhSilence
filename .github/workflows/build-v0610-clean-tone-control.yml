name: Build ANC Lab v0.6.10 clean-tone control
on:
  push:
    branches: [ feature/room-anc-v062 ]
    paths:
      - 'anclab/**'
      - '.github/workflows/build-v0610-clean-tone-control.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/room-anc-v062
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Restore ANC Lab development signing directory
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: anclab-debug-signing-v2
      - name: Ensure stable ANC Lab debug signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Test and build ANC Lab debug APK
        run: ./gradlew :anclab:clean :anclab:testDebugUnitTest :anclab:assembleDebug --stacktrace
      - name: Upload ANC Lab APK
        uses: actions/upload-artifact@v4
        with:
          name: ANC-Lab-v0.6.10-clean-tone-control-dev-debug
          path: anclab/build/outputs/apk/debug/anclab-debug.apk
          retention-days: 14
