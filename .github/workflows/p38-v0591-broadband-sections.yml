name: P38 v0.5.9.1 broadband section replay

on:
  push:
    branches:
      - test/p38-v059-section-replay
    paths:
      - 'tools/replay/P38BroadbandClosedLoopReplay.java'
      - '.github/workflows/p38-v0591-broadband-sections.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download P38 WAV
        run: |
          pip install gdown
          gdown 1NiNG6CORVcKrDd9YZGPVpkCqsQUewG6J -O P38.wav
          echo "SHA256=$(sha256sum P38.wav | cut -d' ' -f1)"
      - name: Compile broadband replay
        run: |
          mkdir -p replay-classes
          javac -d replay-classes \
            anclab/src/main/java/com/p38/anclab/dsp/DcBlocker.java \
            anclab/src/main/java/com/p38/anclab/dsp/HeadphoneBandLimiter.java \
            anclab/src/main/java/com/p38/anclab/dsp/PredictableFrequencyExcluder.java \
            anclab/src/main/java/com/p38/anclab/dsp/FeedbackFxNlms.java \
            tools/replay/P38BroadbandClosedLoopReplay.java
      - name: Run broadband section sweep
        run: |
          mkdir -p results
          : > results/broadband-sections.txt
          for sec in '20 200' '300 480' '600 780' '900 1080' '1200 1380' '1500 1680' '1800 1980' '2100 2280' '2370 2550'; do
            set -- $sec
            echo "=== $1-$2 ===" | tee -a results/broadband-sections.txt
            java -cp replay-classes replay.P38BroadbandClosedLoopReplay P38.wav "$1" "$2" | tee -a results/broadband-sections.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: P38-v0591-broadband-sections
          path: results/broadband-sections.txt
          retention-days: 14
