name: Apply v0.5.9.1 monitor-capacity fix

on:
  push:
    branches:
      - fix/p38-monitor-capacity-v0591
    paths:
      - 'tools/apply_v0591_monitor_capacity_fix.py'
      - '.github/workflows/apply-v0591-monitor-capacity-fix.yml'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Restore ANC Lab development signing directory
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: anclab-debug-signing-v2
      - name: Ensure stable ANC Lab debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ANC Lab Development,O=ANC Lab,C=AU"
          fi
      - name: Apply production fix
        run: python tools/apply_v0591_monitor_capacity_fix.py
      - name: Run ANC Lab tests and build
        run: |
          chmod +x gradlew
          ./gradlew :anclab:clean :anclab:testDebugUnitTest :anclab:assembleDebug --stacktrace
      - name: Commit validated production changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add anclab/build.gradle.kts anclab/src/main/java/com/p38/anclab/dsp/VehicleNarrowbandBank.java anclab/src/test/java/com/p38/anclab/dsp/VehicleMonitorOnlyCapacityTest.java CHANGELOG.md
          git commit -m 'ANC Lab 0.5.9.1: exclude monitor-only lanes from controller capacity'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: ANC-Lab-v0.5.9.1-rebuild-debug
          path: anclab/build/outputs/apk/debug/anclab-debug.apk
          retention-days: 14
